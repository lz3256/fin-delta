[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-delta"
version = "0.1.0"
description = "A reproducible financial reasoning post-training research starter"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = [
  "torch==2.8.0", "transformers==4.56.2", "trl==0.23.1",
  "peft==0.17.1", "datasets==4.1.1", "accelerate==1.10.1"
]
cuda = ["bitsandbytes==0.47.0; platform_system == 'Linux'"]

[project.scripts]
findelta = "findelta.cli:main"

[tool.setuptools.packages.find]
include = ["findelta*"]
